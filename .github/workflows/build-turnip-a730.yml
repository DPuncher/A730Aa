name: Build Turnip A730 (AdrenoTools)

on:
  workflow_dispatch:
    inputs:
      mesa_repo:
        description: Mesa git URL
        default: https://gitlab.freedesktop.org/mesa/mesa.git
      mesa_ref:
        description: Branch or tag
        default: main
      sdk_ver:
        description: Android API level
        default: "31"
      diag:
        description: "Диагностическая сборка (assert'ы включены, символы не вырезаны). 0 = обычная, 1 = diag"
        type: choice
        options: ["0", "1"]
        default: "0"
      patch_strict:
        description: "1 = остановить сборку, если патч из patches/ не применился; 0 = пропустить такой патч"
        type: choice
        options: ["1", "0"]
        default: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build flex bison glslang-tools zip unzip curl file \
            pkg-config ccache libexpat1-dev zlib1g-dev python3-pip patch
          python3 -m pip install --user --break-system-packages meson mako pyyaml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build driver
        env:
          MESA_REPO: ${{ inputs.mesa_repo }}
          MESA_REF: ${{ inputs.mesa_ref }}
          SDK_VER: ${{ inputs.sdk_ver }}
          DIAG: ${{ inputs.diag }}
          PATCH_STRICT: ${{ inputs.patch_strict }}
          AUTHOR: ${{ github.repository_owner }}
        run: bash ./build_turnip_a730.sh

      - uses: actions/upload-artifact@v4
        with:
          name: turnip-a730
          path: out/*.zip
          if-no-files-found: error

      # Нужен только для подгонки патчей: кладёт копии двух исходных файлов Mesa в ветку mesa-snapshot.
      - name: Publish Mesa source snapshot
        if: always()
        continue-on-error: true
        run: |
          if [ -d snapshot ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git checkout --orphan mesa-snapshot
            git rm -rf --cached . >/dev/null 2>&1 || true
            git add -f snapshot
            git commit -q -m "Mesa source snapshot"
            git push -f origin mesa-snapshot
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-snapshot
          path: snapshot
          if-no-files-found: ignore
