name: Build Turnip A730 (AdrenoTools)

# Один запуск собирает 5 вариантов параллельно (каждый — отдельный артефакт), все на коммите рабочего Gen8 V39:
#   base    — чистый Mesa, без патчей (контроль: ведёт себя как V39)
#   a7xx    — рецепт StevenMXZ для A7xx: откат коммита D32S8 + has_early_preamble=False
#   nolrz   — base + TU_DEBUG=nolrz по умолчанию (проверка мерцания: LRZ)
#   noubwc  — base + TU_DEBUG=noubwc по умолчанию (проверка мерцания: сжатие UBWC)
#   flushall — base + TU_DEBUG=flushall по умолчанию (диагностика: если мерцание уходит, дело в синхронизации; FPS упадёт)

on:
  workflow_dispatch:
    inputs:
      mesa_repo:
        description: Mesa git URL
        default: https://gitlab.freedesktop.org/mesa/mesa.git
      mesa_ref:
        description: "Ветка, тег или хэш коммита (2648b2059f = база рабочего Gen8 V39)"
        default: 2648b2059f
      ndk_ver:
        description: "NDK (у V39 — r29)"
        default: android-ndk-r29
      sdk_ver:
        description: "Android API level сборки (у V39 — 34)"
        default: "34"
      diag:
        description: "Диагностическая сборка (assert'ы включены, символы не вырезаны). 0 = обычная, 1 = diag"
        type: choice
        options: ["0", "1"]
        default: "0"

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            a7xx: "0"
            tu_debug: ""
          - variant: a7xx
            a7xx: "1"
            tu_debug: ""
          - variant: nolrz
            a7xx: "0"
            tu_debug: "nolrz"
          - variant: noubwc
            a7xx: "0"
            tu_debug: "noubwc"
          - variant: flushall
            a7xx: "0"
            tu_debug: "flushall"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build flex bison glslang-tools zip unzip curl file \
            pkg-config ccache libexpat1-dev zlib1g-dev python3-pip patch
          python3 -m pip install --user --break-system-packages meson mako pyyaml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build driver (${{ matrix.variant }})
        env:
          MESA_REPO: ${{ inputs.mesa_repo }}
          MESA_REF: ${{ inputs.mesa_ref }}
          NDK_VER: ${{ inputs.ndk_ver }}
          SDK_VER: ${{ inputs.sdk_ver }}
          DIAG: ${{ inputs.diag }}
          VARIANT: ${{ matrix.variant }}
          NO_PATCHES: "1"
          A7XX_RECIPE: ${{ matrix.a7xx }}
          TU_DEFAULT_DEBUG: ${{ matrix.tu_debug }}
          SNAPSHOT: "0"
          AUTHOR: ${{ github.repository_owner }}
        run: bash ./build_turnip_a730.sh

      - uses: actions/upload-artifact@v4
        with:
          name: turnip-a730-${{ matrix.variant }}
          path: out/*.zip
          if-no-files-found: error
