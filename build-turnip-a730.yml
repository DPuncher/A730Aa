name: Build Turnip A730 (AdrenoTools)

on:
  workflow_dispatch:
    inputs:
      mesa_repo:
        description: Mesa git URL
        default: https://gitlab.freedesktop.org/mesa/mesa.git
      mesa_ref:
        description: Branch or tag
        default: main
      sdk_ver:
        description: Android API level
        default: "31"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build flex bison glslang-tools zip unzip curl file \
            pkg-config ccache libexpat1-dev zlib1g-dev python3-pip
          python3 -m pip install --user --break-system-packages meson mako pyyaml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build driver with Anti-Freeze Patch
        env:
          MESA_REPO: ${{ inputs.mesa_repo }}
          MESA_REF: ${{ inputs.mesa_ref }}
          SDK_VER: ${{ inputs.sdk_ver }}
          AUTHOR: ${{ github.repository_owner }}
        run: |
          # Фоновый процесс ждет клонирования Mesa скриптом и применяет патч от зависаний в UE5
          (
            while [ ! -f "mesa/src/freedreno/vulkan/tu_knl_kgsl.cc" ]; do
              sleep 1
            done
            echo "--> Applying anti-freeze patch to tu_knl_kgsl.cc..."
            sed -i '/wait_timestamp_safe(/a \   if (abs_timeout_ns > 5ULL * 1000 * 1000 * 1000) abs_timeout_ns = 5ULL * 1000 * 1000 * 1000;' mesa/src/freedreno/vulkan/tu_knl_kgsl.cc
          ) &

          bash ./build_turnip_a730.sh

      - uses: actions/upload-artifact@v4
        with:
          name: turnip-a730
          path: out/*.zip
          if-no-files-found: error
